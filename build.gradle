buildscript {
    repositories {
        gradlePluginPortal()
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath 'com.modrinth.minotaur:Minotaur:2.+'
        classpath 'gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.2' // Required for NeoGradle
        classpath 'net.minecraftforge.gitversion:net.minecraftforge.gitversion.gradle.plugin:3.1.7'
        classpath 'net.minecraftforge.changelog:net.minecraftforge.changelog.gradle.plugin:3.2.2'
    }
}

apply plugin: 'org.jetbrains.gradle.plugin.idea-ext'
apply plugin: 'net.minecraftforge.gitversion'
apply plugin: 'net.minecraftforge.changelog'

changelog {
    from '19.0.0'
}

ext {
    mod_version = gitversion.getTagOffset()
    changelog_file = rootProject.tasks.createChangelog.outputFile.get().asFile
    trimChangelog = (String text) -> {
        def m = text =~ /(?s) - (?:[0-9.]+) (.+?)(?=( - )|$)/
        return '```\n' + m[0][1].replaceAll(/(?m)^ */, '')
    }
}

version = "${minecraft_version}-${mod_version}"

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'

    if (!project.name.equals("Common")) {
        apply plugin: 'com.modrinth.minotaur'
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs += ["-Xmaxerrs", "10000"]
    }

    compileJava.dependsOn createChangelog

    version = rootProject.version

    jar {
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : mod_version,
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : mod_version,
                    'Implementation-Vendor'   : mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestamp'               : System.currentTimeMillis(),
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Build-On-Minecraft'      : minecraft_version
            ])
        }
    }

    repositories {
        mavenCentral()
        // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public'
        }
        exclusiveContent {
            forRepositories(
                    maven {
                        name = "NeoForge"
                        url = 'https://maven.neoforged.net/releases'
                    }
            )
            filter { includeGroup('org.parchmentmc.data') }
        }
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(25)
    }

    // Declare capabilities on the outgoing configurations.
    // Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
    ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
        configurations."$variant".outgoing {
            capability("$group:${project.name}:$version")
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
            capability("$group:$mod_id:$version")
        }
        publishing.publications.configureEach {
            suppressPomMetadataWarningsFor(variant)
        }
    }

    processResources {
        var expandProps = [
                minecraft_version   : minecraft_version,
                forge_version       : forge_version, forge_version_range: forge_version_range, forge_loader_version_range: forge_loader_version_range,
                neoforge_version    : neoforge_version, neoforge_version_range: neoforge_version_range, neoforge_loader_version_range: neoforge_loader_version_range,
                glitchcore_version  : glitchcore_version,
                terrablender_version: terrablender_version,
                mod_id              : mod_id, mod_name: mod_name, mod_display_name: mod_display_name, mod_version: mod_version,
                mod_authors         : mod_authors, mod_description: mod_description,
                mod_issues_url      : mod_issues_url, mod_page_url: mod_page_url, mod_git_url: mod_git_url,
                mod_discord_url     : mod_discord_url,
                mod_license         : mod_license
        ]

        var jsonExpandProps = expandProps.collectEntries {
            key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
        }

        filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }

        filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
            expand jsonExpandProps
        }

        inputs.properties(expandProps)
    }

    // Build setup for non-common subprojects
    if (!project.name.equals("Common")) {
        dependencies {
            compileOnly(project(':Common')) {
                capabilities {
                    requireCapability "$group:$mod_id"
                }
                def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
                attributes {
                    attribute(loaderAttribute, 'common')
                }
            }
        }

        tasks.withType(JavaCompile).configureEach {
            source(project(":Common").sourceSets.main.allSource)
        }

        processResources {
            from project(":Common").sourceSets.main.resources
        }
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    afterEvaluate {
        // Share Modrinth configuration between loaders
        // Unfortunately the CurseForge plugin breaks when doing this
        if (!name.equals("Common")) {
            modrinth {
                token = findProperty('modrinthToken')
                projectId = mod_modrinth_id
                versionNumber = mod_version
                versionName = "${mod_version} for ${name} ${minecraft_version}"
                versionType = release_channel
                uploadFile = jar

                gameVersions = [minecraft_version]
                loaders = [name.toLowerCase()]
                dependencies {
                    if (name.equals("Fabric")) {
                        required.project "fabric-api"
                    }
                }

                if (changelog_file.exists()) {
                    changelog = trimChangelog(changelog_file.text)
                }
            }
        }

        // archivesBaseName is not set until after initial evaluation
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId project.base.archivesName.get()
                    groupId project.group
                    version project.version
                    if (name.equals("Forge")) {
                        from components.shadowJar
                    } else {
                        from components.java
                    }

                    pom {
                        name = project.base.archivesName.get()
                        description = project.mod_description
                        url = project.mod_git_url
                        scm {
                            url = project.mod_git_url
                            connection = project.mod_scm_url
                            developerConnection = project.mod_scm_url
                        }
                        issueManagement {
                            system = 'github'
                            url = project.mod_issues_url
                        }
                        licenses {
                            license {
                                name = project.mod_license
                            }
                        }
                        developers {
                            developer {
                                id = 'adubbz'
                                name = 'Adubbz'
                            }
                        }
                        withXml {
                            NodeList dependencies = asNode().dependencies
                            NodeList allDeps = dependencies.'*'

                            // Remove forge deps
                            allDeps.<Node> findAll() { Node el ->
                                el.artifactId.text() == 'forge' && el.groupId.text() == 'net.minecraftforge'
                            }.forEach() { Node el ->
                                el.parent().remove(el)
                            }
                            // Remove ForgeGradle's mapped suffix from versions & set as optional so anyone else doesn't inherit them
                            allDeps.<Node> findAll() { Node el ->
                                el.version.text().contains('_mapped_')
                            }.each { Node el ->
                                el.version.each { Node version ->
                                    def versionText = version.text()
                                    version.setValue(versionText.substring(0, versionText.indexOf('_mapped_')))
                                }
                                el.appendNode('optional', true)
                            }
                        }
                    }
                }
            }
            repositories {
                maven {
                    url = "https://maven.minecraftforge.net/releases/"
                    credentials {
                        username = System.getenv("MAVEN_USER")
                        password = System.getenv("MAVEN_PASSWORD")
                    }
                }
            }
        }
    }
}
